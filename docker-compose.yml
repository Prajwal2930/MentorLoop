services:
  backend:
    image: prajwal2930/mentorloop-backend:latest
    #build: 
     #context: ./backend 
     #dockerfile: Dockerfile
    
    container_name: backend
    env_file: 
      - ./backend/.env
    ports:
      - "5000:5000"
    restart: always
    networks: 
      - mentorloop-network
    


  frontend:
    image: prajwal2930/mentorloop-frontend:latest
    #build: 
     #context: ./frontend
     #dockerfile: Dockerfile

    depends_on:
        - backend

    container_name: frontend
    env_file:
      - ./frontend/.env
    ports:
      - "3000:80"

    restart: always

    networks:
      - mentorloop-network


networks:
  mentorloop-network:
    driver: bridge